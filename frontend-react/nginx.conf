# ==================== 1. 비정상 접근 차단 (Default Server) ====================
server {
    listen 80 default_server;
    server_name _;

    # 허용되지 않은 IP나 도메인 접근 시 연결 즉시 차단
    return 444;
}

# ==================== 2. 정상 도메인 서비스 및 리버스 프록시 ====================
server {
    listen 80;
    server_name shdomain.kro.kr;

    # ==================== React 정적 파일 서빙 ====================
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;

        # SPA(Single Page Application) 라우팅 지원
        try_files $uri $uri/ /index.html;
    }

    # ==================== Spring Boot API 프록시 ====================
    location /api {
        proxy_pass http://crawling-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================== OAuth2 로그인 프록시 ====================
    # /oauth2/authorization/google, /login/oauth2/code/google 같은 Spring Security 경로를 백엔드로 전달합니다.
    location /oauth2 {
        proxy_pass http://crawling-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login {
        proxy_pass http://crawling-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
